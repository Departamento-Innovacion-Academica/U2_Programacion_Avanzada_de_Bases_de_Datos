<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flujo de Optimización SQL</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-mint: #38bdf8; /* Tono cian eléctrico para máxima visibilidad */
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
            overflow-x: hidden;
        }

        /* Indicador de ayuda */
        .instrucciones {
            position: fixed;
            top: 20px;
            color: rgba(248, 250, 252, 0.4);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            user-select: none;
        }

        /* --- Contenedor Principal --- */
        .contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            perspective: 1000px;
        }

        /* --- Estilo de las tarjetas / Bloques --- */
        .bloque {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 440px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5),
                        0 0 15px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0; /* Para animación látigo */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .bloque:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.7),
                        0 0 20px rgba(56, 189, 248, 0.4);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .texto {
            font-weight: 700;
            font-size: 19px;
            line-height: 1.3;
            color: #ffffff;
            max-width: 260px;
        }

        /* Contenedor del Icono con fondo sutil */
        .icono {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .icono svg {
            width: 100%;
            height: 100%;
            stroke: var(--accent-mint);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }

        /* --- Flechas triangulares de conexión --- */
        .flecha-container {
            padding: 6px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flecha {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 14px solid #334155;
            transition: all 0.3s ease;
        }

        /* --- ANIMACIÓN ESTILO LÁTIGO (WHIP) --- */
        @keyframes whipIn {
            0% {
                opacity: 0;
                transform: translateX(-180%) scaleX(1.8) rotate(-10deg);
            }
            60% {
                opacity: 1;
                transform: translateX(25%) scaleX(0.85) rotate(4deg);
            }
            80% {
                transform: translateX(-8%) scaleX(1.03);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scaleX(1) rotate(0deg);
            }
        }

        /* Animación Pista de Aterrizaje */
        @keyframes runwayLights {
            0%, 100% {
                opacity: 0.3;
                border-top-color: #334155;
                filter: drop-shadow(0 0 0px transparent);
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                border-top-color: var(--accent-mint);
                filter: drop-shadow(0 0 8px var(--accent-mint));
                transform: scale(1.2);
            }
        }

        /* Aplicación de clases animadas */
        .animar .bloque {
            animation: whipIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .animar .flecha {
            animation: runwayLights 1.8s infinite ease-in-out;
        }

        /* Delays */
        .animar .bloque:nth-child(1)  { animation-delay: 0.1s; }
        .animar .bloque:nth-child(3)  { animation-delay: 0.3s; }
        .animar .bloque:nth-child(5)  { animation-delay: 0.5s; }
        .animar .bloque:nth-child(7)  { animation-delay: 0.7s; }
        .animar .bloque:nth-child(9)  { animation-delay: 0.9s; }

        .animar .flecha-container:nth-child(2) .flecha { animation-delay: 0.0s; }
        .animar .flecha-container:nth-child(4) .flecha { animation-delay: 0.3s; }
        .animar .flecha-container:nth-child(6) .flecha { animation-delay: 0.6s; }
        .animar .flecha-container:nth-child(8) .flecha { animation-delay: 0.9s; }

    </style>
</head>
<body>

    <div class="instrucciones">Presiona <strong>ENTER</strong> para reiniciar la animación</div>

    <div class="contenedor animar" id="diagrama">

        <!-- Bloque 1 -->
        <div class="bloque">
            <span class="texto">Ejecución de consultas en producción</span>
            <div class="icono">
                <!-- Servidor DB con Engranaje -->
                <svg viewBox="0 0 24 24">
                    <path d="M4 6c0 1.657 3.582 3 8 3s8-1.343 8-3-3.582-3-8-3-8 1.343-8 3z"></path>
                    <path d="M4 6v6c0 1.657 3.582 3 8 3"></path>
                    <path d="M4 12v6c0 1.657 3.582 3 8 3"></path>
                    <!-- Engranaje integrado -->
                    <circle cx="18" cy="16" r="2"></circle>
                    <path d="M18 12v1m0 6v1m3.5-3.5h-1m-6 0h-1m4.6-2.6l-.7.7m-4.2 4.2l-.7.7m0-5.6l.7.7m4.2 4.2l.7.7"></path>
                </svg>
            </div>
        </div>

        <div class="flecha-container"><div class="flecha"></div></div>

        <!-- Bloque 2 -->
        <div class="bloque">
            <span class="texto">Monitoreo del rendimiento</span>
            <div class="icono">
                <!-- Velocímetro con Gráfica -->
                <svg viewBox="0 0 24 24">
                    <path d="M12 14l3-3"></path>
                    <path d="M3.34 15a10 10 0 1 1 17.32 0"></path>
                    <path d="M2 20l5-5 4 4 6-6 5 5"></path>
                </svg>
            </div>
        </div>

        <div class="flecha-container"><div class="flecha"></div></div>

        <!-- Bloque 3 -->
        <div class="bloque">
            <span class="texto">Identificación de cuellos de botella</span>
            <div class="icono">
                <!-- Embudo con Alerta -->
                <svg viewBox="0 0 24 24">
                    <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
                    <circle cx="12" cy="9" r="2.5" fill="#1e293b" stroke="var(--accent-mint)"></circle>
                    <line x1="12" y1="8" x2="12" y2="9.5"></line>
                    <circle cx="12" cy="10.5" r="0.2" fill="var(--accent-mint)"></circle>
                </svg>
            </div>
        </div>

        <div class="flecha-container"><div class="flecha"></div></div>

        <!-- Bloque 4 -->
        <div class="bloque">
            <span class="texto">Análisis del plan de ejecución</span>
            <div class="icono">
                <!-- Consola / SQL con Lupa -->
                <svg viewBox="0 0 24 24">
                    <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                    <line x1="6" y1="7" x2="10" y2="7"></line>
                    <line x1="6" y1="11" x2="14" y2="11"></line>
                    <circle cx="16" cy="16" r="4" fill="#1e293b" stroke="var(--accent-mint)"></circle>
                    <line x1="19" y1="19" x2="22" y2="22"></line>
                </svg>
            </div>
        </div>

        <div class="flecha-container"><div class="flecha"></div></div>

        <!-- Bloque 5 -->
        <div class="bloque">
            <span class="texto">Aplicación de mejoras</span>
            <div class="icono">
                <!-- Cohete en Despegue -->
                <svg viewBox="0 0 24 24">
                    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                    <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-3.05 11a22.35 22.35 0 0 1-3.95 2z"></path>
                    <path d="M9 18l-4 4"></path>
                    <path d="M18 9l4-4"></path>
                </svg>
            </div>
        </div>

    </div>

    <script>
        // Disparar animación con la tecla ENTER
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const diagrama = document.getElementById('diagrama');
                diagrama.classList.remove('animar');
                void diagrama.offsetWidth; // Forzar reflow
                diagrama.classList.add('animar');
            }
        });
    </script>
</body>
</html>
