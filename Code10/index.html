<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta con Múltiples Tablas SQL</title>
  
  <!-- Fuente Poppins y Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-purple: #9333ea;
      --accent-purple: #c084fc;
      --bg-gradient: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 50%, #090d16 100%);
      --glass-bg: rgba(30, 27, 75, 0.45);
      --glass-border: rgba(168, 85, 247, 0.2);
      --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --code-bg: rgba(15, 23, 42, 0.75);
      
      /* Sintaxis de código */
      --keyword-color: #a855f7;  /* Morado para SELECT, FROM, JOIN, ON */
      --alias-color: #38bdf8;    /* Azul claro para los alias (c, p, d) */
      --field-color: #818cf8;    /* Indigo/Azul para columnas/atributos */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      color: var(--text-main);
      perspective: 1000px;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: var(--card-shadow);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      
      /* Animación Glow & 3D Tilt Reveal */
      opacity: 0;
      transform: translateY(40px) scale(0.92) rotateX(-12deg);
      filter: blur(8px);
      animation: uniqueReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 16px 45px 0 rgba(147, 51, 234, 0.25), 
                  0 0 20px rgba(168, 85, 247, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f3f4f6;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-weight: 500;
      background-color: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    /* Caja de código */
    .code-container {
      position: relative;
      background: var(--code-bg);
      border: 1px solid rgba(168, 85, 247, 0.15);
      border-radius: 12px;
      padding: 1.25rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.65;
      text-align: left;
      overflow-x: auto;
      transition: border-color 0.3s ease;
      margin-bottom: 1.25rem;
    }

    .card:hover .code-container {
      border-color: rgba(168, 85, 247, 0.4);
    }

    /* Botón interactivo de copiar */
    .copy-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(147, 51, 234, 0.2);
      color: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border-color: #22c55e;
    }

    /* Texto explicativo inferior */
    .description {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent-purple);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
    }

    /* Highlight de sintaxis */
    .keyword { color: var(--keyword-color); font-weight: 600; }
    .alias { color: var(--alias-color); font-weight: 500; }
    .field { color: var(--field-color); }
    .identifier { color: #e2e8f0; }

    /* Keyframes de la animación de entrada */
    @keyframes uniqueReveal {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.92) rotateX(-12deg);
        filter: blur(8px);
        box-shadow: 0 0 0 rgba(168, 85, 247, 0);
      }
      60% {
        box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0deg);
        filter: blur(0);
        box-shadow: var(--card-shadow);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <div class="card-header">
        <div class="title-group">
          <i data-lucide="network" style="color: #c084fc; width: 20px;"></i>
          <h3 class="title">Ejemplo de consulta con múltiples tablas</h3>
          <span class="badge">JOINs</span>
        </div>
        <button class="copy-btn" onclick="copyCode(this, 'code-multitable')">
          <i data-lucide="copy" style="width: 14px;"></i>
          <span>Copiar</span>
        </button>
      </div>

      <div class="code-container" id="code-multitable">
        <div><span class="keyword">SELECT</span> <span class="alias">c</span>.<span class="field">nombre</span>, <span class="alias">p</span>.<span class="field">fecha</span>, <span class="alias">d</span>.<span class="field">producto</span></div>
        <div><span class="keyword">FROM</span> <span class="identifier">clientes</span> <span class="alias">c</span></div>
        <div><span class="keyword">JOIN</span> <span class="identifier">pedidos</span> <span class="alias">p</span> <span class="keyword">ON</span> <span class="alias">c</span>.<span class="field">id_cliente</span> = <span class="alias">p</span>.<span class="field">id_cliente</span></div>
        <div><span class="keyword">JOIN</span> <span class="identifier">detalle_pedidos</span> <span class="alias">d</span> <span class="keyword">ON</span> <span class="alias">p</span>.<span class="field">id_pedido</span> = <span class="alias">d</span>.<span class="field">id_pedido</span>;</div>
      </div>

      <div class="description">
        <i data-lucide="lightbulb" style="color: #f59e0b; width: 18px; flex-shrink: 0; margin-top: 2px;"></i>
        <span>Para optimizar este tipo de consultas, es recomendable:</span>
      </div>

    </div>
  </div>

  <script>
    // Inicializar iconos Lucide
    lucide.createIcons();

    // Función para copiar código al portapapeles
    function copyCode(button, elementId) {
      const codeContainer = document.getElementById(elementId);
      const textToCopy = codeContainer.innerText;

      navigator.clipboard.writeText(textToCopy).then(() => {
        const textSpan = button.querySelector('span');
        
        button.classList.add('copied');
        textSpan.textContent = '¡Copiado!';
        
        setTimeout(() => {
          button.classList.remove('copied');
          textSpan.textContent = 'Copiar';
        }, 2000);
      });
    }
  </script>

</body>
</html>
